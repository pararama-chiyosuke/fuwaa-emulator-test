<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#30363e"><link rel="manifest" href="manifest.webmanifest"><title>ふわぁ テキポ GBA版 · 追加の案内 Ver.0.31</title><style>body{margin:0;background:#16191e;color:#f3ead8;font:16px/1.7 system-ui,sans-serif}main{max-width:540px;margin:auto;padding:26px 20px}img{width:112px;border-radius:20px}h1{font-size:24px}button,a.play{display:block;width:100%;box-sizing:border-box;text-align:center;padding:15px;margin:18px 0;background:#bd9b60;color:#14181e;border:0;border-radius:12px;font-weight:800;font-size:17px;text-decoration:none}.note{background:#292f37;border-radius:12px;padding:18px}a{color:#e9ca86}</style></head><body><main><p><a href="../">← ゲーム別アイコン一覧へ</a></p><img src="icon-192.png" alt=""><h1>ふわぁ テキポ GBA版</h1><p>このゲームをホーム画面から直接起動できます。</p><button id="install">アプリの追加画面を表示</button><div class="note" id="note">Chromeの対応状況によっては自動表示できません。その場合は、Chrome右上の「︙」→「ホーム画面に追加」→「アプリをインストール」を選んでください。<p>「すでにインストールされています」と出た場合は、既存アプリの状態をChromeが認識しています。</p></div><a class="play" href="./index.html">ゲームを開く</a><p>ショートカットの場合は、ゲーム画面を開いてChromeの「︙」→「ホーム画面に追加」→「ショートカットを作成」を選びます。</p></main><script>let deferred=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.querySelector('#note').textContent='この端末ではアプリの追加画面を表示できます。';});document.querySelector('#install').addEventListener('click',async()=>{if(deferred){const p=deferred;deferred=null;try{await p.prompt();}catch(e){document.querySelector('#note').textContent='追加画面を開けませんでした。Chromeのメニューから操作してください。';}}else{document.querySelector('#note').textContent='この画面から自動表示できません。Chrome右上の「︙」→「ホーム画面に追加」を選んでください。すでにインストール済みの場合もあります。';}});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
