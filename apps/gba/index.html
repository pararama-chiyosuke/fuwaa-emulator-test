 '[class*="ejs_gamepad"]','[class*="ejs-gamepad"]',
 '[class*="ejs_virtual"]','[class*="ejs-virtual"]',

 const restart=nodes.find(el=>/^Restart$/i.test(text(el)));

  let parent=restart.parentElement;
  for(let i=0;parent&&parent!==root&&i<7;i++,parent=parent.parentElement){

   if(/Save State/i.test(t)&&/Load State/i.test(t)&&/Settings/i.test(t)&&!parent.querySelector('canvas')){
